[package]
name = "capture-clock-repair"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Conservative capture-time repair plans and reversible XMP sidecars"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-capture-clock-repair"
readme = "README.md"
keywords = ["exif", "xmp", "photography", "metadata", "cli"]
categories = ["command-line-utilities", "multimedia::images"]
include = ["/src/**", "/examples/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[lib]
name = "capture_clock_repair"
path = "src/lib.rs"

[[bin]]
name = "capture-clock-repair"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.45", features = ["derive"] }
csv = "1.3.1"
kamadak-exif = "0.6.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.21.0"
